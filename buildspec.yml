version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12

  build:
    commands:
      - echo "Running unit tests..."
      - python3 -m unittest discover -s tests -v

  post_build:
    commands:
      - echo "Packaging Lambda application..."
      - cd lambda
      - zip -j ../deployment.zip lambda_app.py
      - cd ..
      - echo "Lambda deployment package created."

      - echo "Deploying application to AWS Lambda..."
      - aws lambda update-function-code --function-name week36-serverless-task-processor --zip-file fileb://deployment.zip --region us-east-1
      - echo "Lambda deployment command completed."

artifacts:
  files:
    - deployment.zip
